{% extends "base.html" %}
{% block title %}Apply{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="mb-1">Apply for: {{ job.title }}</h4>
        <div class="text-muted mb-3">{{ job.company }} • {{ job.location }}</div>

        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-success">Submit Application</button>
          <a class="btn btn-outline-secondary" href="{% url 'job_detail' job.id %}">Back</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
